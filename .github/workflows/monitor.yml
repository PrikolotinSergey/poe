
name: POE Schedule Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe-schedule-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      
      - name: Diagnose POE network access
        run: |
          set +e

          echo "=== DNS ==="
          getent ahosts www.poe.pl.ua
          getent ahosts poe.pl.ua

          echo "=== IPv4 / IPv6 ==="
          for url in \
            https://www.poe.pl.ua/ \
            https://poe.pl.ua/ \
            http://www.poe.pl.ua/ \
            https://www.poe.pl.ua/customs/dynamicgpv-info.php
          do
            echo
            echo "Testing: $url"

            curl -4 -sS -o /dev/null \
              --connect-timeout 8 --max-time 12 \
              -w "IPv4 HTTP=%{http_code} IP=%{remote_ip}\n" \
              "$url"
            echo "IPv4 exit code: $?"

            curl -6 -sS -o /dev/null \
              --connect-timeout 8 --max-time 12 \
              -w "IPv6 HTTP=%{http_code} IP=%{remote_ip}\n" \
              "$url"
            echo "IPv6 exit code: $?"
          done

      - name: Check schedule and notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update POE monitor state"
            git push
          fi
