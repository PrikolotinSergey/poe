
name: POE Schedule Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe-schedule-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose source connectivity
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://www.poe.pl.ua/",
              "https://www.poe.pl.ua/customs/dynamicgpv-info.php",
          ]

          for url in urls:
              print(f"\nTesting {url}")
              try:
                  if url.endswith(".php"):
                      response = requests.post(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Referer": "https://prikolotinsergey.github.io/poe/",
                          },
                          timeout=(10, 15),
                      )
                  else:
                      response = requests.get(
                          url,
                          timeout=(10, 15),
                      )

                  print("HTTP:", response.status_code)
                  print("Bytes:", len(response.content))
              except requests.RequestException as exc:
                  print(type(exc).__name__, str(exc))
          PY

      - name: Check schedule and notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update POE monitor state"
            git push
          fi
